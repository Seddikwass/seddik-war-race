name: Test visuel

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: KEEP_TEST=1 npm run build
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node scripts/visual-test.js
      - name: Publier les captures sur la branche screens-out
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan screens-out
          git rm -rf --cached . > /dev/null
          git add -f screens
          git commit -m "Captures ${GITHUB_SHA}"
          git push -f origin screens-out
